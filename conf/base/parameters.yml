preprocessing:
  target_column: Potability
  feature_columns: null
  test_size: 0.15
  random_state: 73
  shuffle: true
  stratify: true
  zscore_threshold: 3.0
  rfe:
    enabled: true
    step: 1
    cv_folds: 10
    scoring: roc_auc
    n_jobs: -1
    logistic_max_iter: 5000
    random_state: 73

modeling:
  cross_validation:
    n_splits: 5
    shuffle: true
    random_state: 73

  logistic_regression:
    max_iter: 1000
    solver: lbfgs
    random_state: 73

  random_forest:
    n_estimators: 300
    max_depth: null
    min_samples_leaf: 1
    min_samples_split: 2
    max_features: sqrt
    bootstrap: true
    class_weight: null
    criterion: gini
    max_samples: null
    random_state: 73
    n_jobs: -1

  extra_trees:
    n_estimators: 500
    max_depth: null
    min_samples_leaf: 1
    min_samples_split: 2
    max_features: sqrt
    bootstrap: false
    class_weight: null
    criterion: gini
    max_samples: null
    random_state: 73
    n_jobs: -1

  hist_gradient_boosting:
    max_iter: 300
    learning_rate: 0.1
    max_leaf_nodes: 31
    max_depth: null
    min_samples_leaf: 20
    l2_regularization: 0.0
    max_bins: 255
    early_stopping: false
    class_weight: null
    random_state: 73

  xgboost:
    n_estimators: 300
    max_depth: 3
    learning_rate: 0.1
    subsample: 1.0
    colsample_bytree: 1.0
    min_child_weight: 1
    gamma: 0.0
    reg_alpha: 0.0
    reg_lambda: 1.0
    objective: binary:logistic
    eval_metric: logloss
    tree_method: hist
    random_state: 73
    n_jobs: -1
    verbosity: 0

  random_forest_optimization:
    enabled: true
    n_trials: 75
    sampler: tpe
    random_state: 73
    objective_metric: f1

    search_space:
      n_estimators:
        type: int
        low: 300
        high: 1000
        step: 100

      max_depth:
        type: categorical
        choices: [5, 10, 15, 20, 30, 50, null]

      min_samples_leaf:
        type: int
        low: 1
        high: 20

      min_samples_split:
        type: int
        low: 2
        high: 40

      max_features:
        type: categorical
        choices: [sqrt, log2, 0.3, 0.5, 0.7, null]

      bootstrap:
        type: categorical
        choices: [true]

      class_weight:
        type: categorical
        choices: [null, balanced, balanced_subsample]

      criterion:
        type: categorical
        choices: [gini, entropy, log_loss]

      max_samples:
        type: float
        low: 0.6
        high: 1.0

  extra_trees_optimization:
    enabled: true
    n_trials: 50
    sampler: tpe
    random_state: 73
    objective_metric: f1

    search_space:
      n_estimators:
        type: int
        low: 300
        high: 1000
        step: 100

      max_depth:
        type: categorical
        choices: [5, 10, 15, 20, 30, 50, null]

      min_samples_leaf:
        type: int
        low: 1
        high: 20

      min_samples_split:
        type: int
        low: 2
        high: 40

      max_features:
        type: categorical
        choices: [sqrt, log2, 0.3, 0.5, 0.7, null]

      bootstrap:
        type: categorical
        choices: [true, false]

      class_weight:
        type: categorical
        choices: [null, balanced]

      criterion:
        type: categorical
        choices: [gini, entropy, log_loss]

      max_samples:
        type: float
        low: 0.6
        high: 1.0

  hist_gradient_boosting_optimization:
    enabled: true
    n_trials: 50
    sampler: tpe
    random_state: 73
    objective_metric: f1

    search_space:
      max_iter:
        type: int
        low: 100
        high: 500
        step: 100

      learning_rate:
        type: float
        low: 0.01
        high: 0.3
        log: true

      max_leaf_nodes:
        type: categorical
        choices: [15, 31, 63]

      max_depth:
        type: categorical
        choices: [null, 3, 5, 10]

      min_samples_leaf:
        type: int
        low: 10
        high: 50

      l2_regularization:
        type: float
        low: 0.0
        high: 1.0

      max_bins:
        type: categorical
        choices: [127, 255]

      class_weight:
        type: categorical
        choices: [null, balanced]

  xgboost_optimization:
    enabled: true
    n_trials: 50
    sampler: tpe
    random_state: 73
    objective_metric: f1

    search_space:
      n_estimators:
        type: int
        low: 100
        high: 600
        step: 100

      max_depth:
        type: int
        low: 2
        high: 8

      learning_rate:
        type: float
        low: 0.01
        high: 0.3
        log: true

      subsample:
        type: float
        low: 0.6
        high: 1.0

      colsample_bytree:
        type: float
        low: 0.6
        high: 1.0

      min_child_weight:
        type: int
        low: 1
        high: 10

      gamma:
        type: float
        low: 0.0
        high: 5.0

      reg_alpha:
        type: float
        low: 0.00000001
        high: 1.0
        log: true

      reg_lambda:
        type: float
        low: 0.1
        high: 10.0
        log: true

  mlflow:
    tracking_uri: mlruns
    experiment_name: water_potability_modeling
    run_name: logistic_regression_baseline
    random_forest_run_name: random_forest_nonlinear_probe
    extra_trees_run_name: extra_trees_nonlinear_probe
    hist_gradient_boosting_run_name: hist_gradient_boosting_nonlinear_probe
    xgboost_run_name: xgboost_nonlinear_probe

data_drift:
  # p-value threshold for the two-sample KS test; features with p < threshold are flagged as drifted
  significance_threshold: 0.05
