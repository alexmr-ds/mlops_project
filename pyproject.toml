[project]
name = "mlops-project"
version = "0.1.0"
description = "Kedro-based preprocessing for the water potability dataset"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "great-expectations>=1.17.2",
    "kaggle>=2.1.2",
    "kedro>=1.3.1",
    "matplotlib>=3.10.9",
    "mlflow>=3.7.0",
    "pandas>=2.2,<3",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
]

[dependency-groups]
eda = [
    "ipykernel>=7.2.0",
    "pykernel>=0.1.6",
    "seaborn>=0.13.2",
]
viz = [
    "kedro-viz>=12.3.0",
]

[tool.kedro]
package_name = "mlops_project"
project_name = "mlops_project"
kedro_init_version = "1.3.1"
source_dir = "src"

[tool.kedro_telemetry]
project_id = "b67086f6403c47e1ba804183aaa83228"
