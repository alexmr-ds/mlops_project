preprocessing:
  target_column: Potability
  feature_columns: null
  test_size: 0.15
  random_state: 73
  shuffle: true
  stratify: true
  zscore_threshold: 3.0
  rfe:
    enabled: true
    step: 1
    cv_folds: 10
    scoring: roc_auc
    n_jobs: -1
    logistic_max_iter: 5000
    random_state: 73

modeling:
  cross_validation:
    n_splits: 5
    shuffle: true
    random_state: 73
  logistic_regression:
    max_iter: 1000
    solver: lbfgs
    random_state: 73
  random_forest:
    n_estimators: 300
    max_depth: null
    min_samples_leaf: 1
    random_state: 73
    n_jobs: -1
    class_weight: null
  mlflow:
    tracking_uri: mlruns
    experiment_name: water_potability_modeling
    run_name: logistic_regression_baseline
    random_forest_run_name: random_forest_nonlinear_probe
